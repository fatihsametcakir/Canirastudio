<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Jack & Jill | Can & Irina Studio</title>
<meta name="theme-color" content="#0d0d14">
<script>
// Stüdyo uygulamasıyla aynı tema: 'aktif_tema' (sistem / koyu / açık) aynı adresten okunur
(function(){
  function uygula(){
    var sec='sistem';try{sec=localStorage.getItem('aktif_tema')||'sistem';}catch(e){}
    var koyu=true;try{koyu=window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){}
    var acik=sec==='white'||(sec==='sistem'&&!koyu);
    document.documentElement.dataset.acik=acik?'1':'0';
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',acik?'#f5f5f7':'#0d0d14');
  }
  uygula();
  try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',uygula);}catch(e){}
  window.addEventListener('storage',uygula);window.addEventListener('pageshow',uygula);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,600;1,300&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* Stüdyo teması ile aynı değişkenler (koyu varsayılan; açık tema data-acik="1") */
  :root{
    --bg:#0d0d14;--surface:#16161f;--surface2:#1e1e2a;
    --border:#ffffff14;--border2:#ffffff22;
    --text:#f2f0fa;--text2:#d5d3e6;--text3:#c7c4dc;
    --accent:#ff9191;--accentbg:#ff919122;
    --purple:#bda8fb;--purplebg:#a78bfa20;
    --cyan:#22d3ee;--cyanbg:#22d3ee18;
    --green:#34d399;--greenbg:#34d39918;
    --amber:#fbbf24;--amberbg:#fbbf2418;
    --btn1:#e80000;--btn2:#ea0014;--on-accent:#0d0d14;
    --radius:16px;--radius-sm:10px;
    --ease:cubic-bezier(.34,1.56,.64,1);
    --shadow:0 14px 34px -14px rgba(0,0,0,.7);
    /* eski adlar (satır içi stillerde geçenler) stüdyo değişkenlerine bağlı */
    --ivory:var(--text);--ink:var(--text);--ink-soft:var(--text2);
    --gold-300:var(--accent);--gold-400:var(--accent);--gold-500:var(--accent);--green-ok:var(--green);
    color-scheme:dark;
  }
  :root[data-acik="1"]{
    --bg:#f5f5f7;--surface:#ffffff;--surface2:#f0f0f5;
    --border:#00000010;--border2:#00000018;
    --text:#1a1a2e;--text2:#38385a;--text3:#4a4a6e;
    --accent:#ab0000;--accentbg:#ab000022;
    --purple:#4e16f5;--purplebg:#a78bfa20;
    --cyan:#08616e;--green:#156145;--amber:#6d4f02;
    --on-accent:#fff;
    --shadow:0 10px 26px -14px rgba(26,26,46,.35);
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;min-height:100%;overflow-x:hidden;}
  body{min-height:100vh;}
  .shell{max-width:480px;margin:0 auto;padding:calc(80px + env(safe-area-inset-top)) 14px 60px;min-height:100vh;position:relative;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;font-weight:600;}

  /* üst çubuk: stüdyo uygulamasındaki hap (pill) başlık */
  .topbar{padding:0 14px 0 12px;min-height:56px;display:flex;align-items:center;gap:9px;position:fixed;top:max(10px,calc(env(safe-area-inset-top) + 4px));left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:456px;z-index:200;background:color-mix(in srgb,var(--surface) 38%,transparent);border:1.5px solid color-mix(in srgb,var(--text) 34%,transparent);border-radius:999px;box-shadow:0 0 0 5px color-mix(in srgb,var(--bg) 55%,transparent),0 14px 34px -8px rgba(0,0,0,.85),0 2px 10px -2px rgba(0,0,0,.5),inset 0 1px 0 color-mix(in srgb,var(--text) 14%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);}
  :root[data-acik="1"] .topbar{box-shadow:0 0 0 5px color-mix(in srgb,var(--bg) 55%,transparent),0 14px 30px -10px rgba(26,26,46,.35),0 2px 8px -2px rgba(26,26,46,.2),inset 0 1px 0 #fff;}
  .tb-mark{flex-shrink:0;}
  .topbar-title{font-family:'Cormorant Garamond','Fraunces',serif;font-size:17px;font-weight:600;line-height:1.02;letter-spacing:.03em;white-space:nowrap;}
  .topbar-title .tb-gold{display:block;background:linear-gradient(100deg,#f8e7ae,#d9ac52 40%,#f4dc92 65%,#b0842f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-weight:700;}
  :root[data-acik="1"] .topbar-title .tb-gold{background:linear-gradient(100deg,#8a6112,#b8872a 40%,#9a6f1c 65%,#6e4c0c);-webkit-background-clip:text;background-clip:text;}
  .topbar-title span{display:block;color:var(--accent);font-style:italic;font-weight:600;font-size:16px;letter-spacing:.05em;}
  /* Ana ekrandaki başlıkla aynı görünüm */
  .topbar-title span{background:linear-gradient(100deg,#fbeab4,#e0b457 38%,#f6e19a 62%,#c8963a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
  :root[data-acik="1"] .topbar-title span{background:linear-gradient(100deg,#9a6f1c,#c8963a 40%,#a87a22 62%,#7a540f);-webkit-background-clip:text;background-clip:text;}
  .topbar-title,.topbar-title span,.topbar-title .tb-gold{font-family:'Cormorant Garamond','Fraunces',serif;font-style:normal;font-weight:700;letter-spacing:.03em}
  .topbar-title{display:flex;align-items:baseline;gap:5px;font-size:14.5px;line-height:1.1;white-space:nowrap}
  .topbar-title .tb-gold,.topbar-title span{display:inline!important;font-size:clamp(11px,3.5vw,14.5px)!important}
  .topbar-tag{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--purple);background:var(--purplebg);border:1px solid #a78bfa35;border-radius:99px;padding:5px 11px;white-space:nowrap;}

  @keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .card{background:var(--surface);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);padding:18px;margin-bottom:12px;animation:cardIn .32s var(--ease);}
  .card.dark{background:var(--surface2);color:var(--text);}
  .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px;}
  h2.title{font-size:23px;line-height:1.15;margin-bottom:4px;letter-spacing:-.01em;color:var(--text);}
  p.desc{font-size:13.5px;color:var(--text2);line-height:1.55;margin:6px 0 0;}

  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .choice{background:var(--surface2);color:var(--text);border-radius:var(--radius);padding:22px 14px;text-align:center;cursor:pointer;border:1px solid var(--border2);transition:transform .18s var(--ease),border-color .18s ease,background .18s ease;}
  .choice:active{transform:scale(.96);}
  .choice:hover{transform:translateY(-2px);border-color:#ff6b6b70;background:var(--accentbg);}
  .choice .ic{font-size:28px;display:block;margin-bottom:8px;transition:transform .25s var(--ease);}
  .choice:hover .ic{transform:scale(1.12) rotate(-4deg);}
  .choice .lbl{font-family:'Fraunces',serif;font-weight:600;font-size:16.5px;}
  .choice .hint{font-size:11.5px;color:var(--text3);margin-top:3px;}

  button{font-family:'DM Sans',sans-serif;cursor:pointer;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px 18px;border-radius:var(--radius-sm);border:none;font-weight:600;font-size:14.5px;transition:opacity .15s,transform .1s;}
  .btn:active{transform:scale(.96);opacity:.8;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-gold{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 4px 15px #ff6b6b30;}
  .btn-outline{background:var(--accentbg);border:1px solid #ff6b6b50;color:var(--accent);box-shadow:0 2px 8px -3px #ff6b6b40;}
  .btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
  .card.dark .btn-ghost{background:var(--surface);}
  .btn-danger{background:#ff6b6b22;color:var(--accent);border:1px solid #ff6b6b50;}
  .btn-danger-solid{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 4px 15px #ff6b6b30;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{width:auto;flex:1;}

  label{font-size:11px;font-weight:600;color:var(--text2);display:block;margin:14px 0 6px;letter-spacing:.08em;text-transform:uppercase;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=date],textarea,select{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);font-family:'DM Sans',sans-serif;font-size:15px;background:var(--surface2);color:var(--text);transition:border-color .2s;outline:none;}
  .card.dark input[type=text],.card.dark input[type=date],.card.dark textarea,.card.dark select{background:var(--surface);}
  select option{background:var(--surface2);color:var(--text);}
  textarea{resize:vertical;min-height:90px;line-height:1.6;font-size:14px;}
  input:focus,textarea:focus,select:focus{border-color:#ff6b6b70;box-shadow:0 0 0 3px #ff6b6b1a;}

  .rowline{display:flex;gap:8px;align-items:center;}
  .rowline input{flex:1;}
  .iconbtn{width:38px;height:38px;flex:0 0 38px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .16s ease,transform .16s ease;}
  .iconbtn:active{transform:scale(.9);}
  .iconbtn:hover{background:var(--accentbg);color:var(--accent);}
  .stack{display:flex;flex-direction:column;gap:8px;}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--text3);border:1px solid var(--border2);}
  .chip.on{background:var(--greenbg);color:var(--green);border-color:#34d39940;}
  .chip.wait{background:var(--amberbg);color:var(--amber);border-color:#fbbf2440;animation:pulseSoft 2.2s ease-in-out infinite;}
  @keyframes pulseSoft{0%,100%{opacity:1;}50%{opacity:.6;}}
  .card.dark .chip{background:var(--surface);}

  .bib{width:44px;height:44px;border-radius:50%;flex:none;background:var(--accentbg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:15px;border:1.5px solid #ff6b6b60;}
  .stud-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);}
  .stud-row:last-child{border-bottom:none;}
  .stud-name{font-weight:600;font-size:14.5px;}
  .stud-meta{font-size:11.5px;color:var(--text3);margin-top:2px;}

  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:16px 0;}

  .backbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back-btn{display:inline-flex;align-items:center;gap:7px;background:var(--purplebg);border:1px solid #a78bfa35;color:var(--purple);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;transition:transform .2s var(--ease);}
  .back-btn:active{transform:scale(.93);}

  .modal-overlay{position:fixed;inset:0;background:#00000095;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px;animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:24px;max-width:360px;width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.8);animation:modalIn .22s var(--ease);}
  @keyframes modalIn{from{transform:scale(.92) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
  .modal-title{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--text);margin-bottom:8px;}
  .modal-msg{font-size:14px;line-height:1.55;color:var(--text2);}

  /* öğrenci listesinden çoklu seçim paneli */
  .stu-pick-toggle{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--purplebg);color:var(--purple);border:1px solid #a78bfa50;border-radius:var(--radius-sm);padding:12px 16px;font-weight:600;font-size:14.5px;cursor:pointer;}
  .stu-pick-panel{margin-top:10px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:12px;display:none;}
  .stu-pick-panel.open{display:block;}
  .stu-pick-search{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:14px;margin-bottom:8px;}
  .stu-pick-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .stu-pick-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text);}
  .stu-pick-row:active{background:var(--border);}
  .stu-pick-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;}
  .stu-pick-empty{font-size:13px;color:var(--text3);padding:10px 4px;}
  .stu-pick-actions{display:flex;gap:8px;margin-top:10px;}

  /* jüri puanlama */
  .crit-block{margin-bottom:16px;}
  .crit-name{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin-bottom:8px;}
  .num-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;}
  .num-btn{aspect-ratio:1;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;transition:transform .12s var(--ease),background .16s ease,box-shadow .16s ease;}
  .card.dark .num-btn{background:var(--surface);}
  .num-btn:active{transform:scale(.88);}
  @keyframes popSel{0%{transform:scale(.8);}60%{transform:scale(1.1);}100%{transform:scale(1);}}
  .num-btn.sel{background:var(--accentbg);border-color:#ff6b6b60;color:var(--accent);box-shadow:0 3px 10px -3px #ff6b6b60;animation:popSel .22s var(--ease);}

  .accordion-item{border-bottom:1px solid var(--border);}
  .chip-strip{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 4px;margin:0 -2px;-webkit-overflow-scrolling:touch;}
  .chip-strip::-webkit-scrollbar{display:none;}
  .chip-nav{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border2);color:var(--text3);font-weight:700;font-size:12.5px;transition:transform .18s var(--ease),background .18s ease,box-shadow .18s ease;}
  .chip-nav.done{background:var(--greenbg);border-color:#34d39950;color:var(--green);}
  .chip-nav.active{background:var(--accentbg);border-color:#ff6b6b60;color:var(--accent);transform:scale(1.14);box-shadow:0 3px 10px -3px #ff6b6b60;}
  .progress-track{height:7px;background:var(--surface);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin-top:12px;position:relative;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple),var(--accent));background-size:200% 100%;border-radius:999px;transition:width .35s var(--ease);animation:shimmerMove 2.4s linear infinite;}
  @keyframes shimmerMove{0%{background-position:0% 0%;}100%{background-position:200% 0%;}}
  .swipe-hint{font-size:11px;color:var(--text3);font-weight:600;background:var(--surface);border:1px solid var(--border);padding:4px 9px;border-radius:999px;}
  .score-footer{position:sticky;bottom:12px;z-index:40;box-shadow:0 -10px 30px -10px rgba(0,0,0,.5);}
  .crit-dots{display:flex;gap:6px;justify-content:center;margin:14px 0 2px;}
  .crit-dot{width:9px;height:9px;padding:0;border-radius:50%;border:none;background:var(--border2);transition:transform .16s ease,background .16s ease;}
  .crit-dot.done{background:var(--green);}
  .crit-dot.active{background:var(--accent);transform:scale(1.5);}
  .compact-score{padding:16px 18px;}
  .compact-score .crit-block{margin-bottom:8px;}
  .compact-score .crit-name{font-size:11.5px;margin-bottom:4px;font-weight:700;}
  .compact-score .num-grid{gap:3px;}
  .compact-score .num-btn{aspect-ratio:auto;height:27px;font-size:9.5px;border-radius:7px;}
  .tight-header{padding:16px 18px;}
  .tight-chips{padding:8px 4px 6px;}
  .chip-nav.tiny{width:28px;height:28px;font-size:10.5px;}
  .accordion-item:last-child{border-bottom:none;}
  .acc-head{display:flex;align-items:center;gap:12px;padding:13px 4px;cursor:pointer;}
  .acc-head .status-dot{width:9px;height:9px;border-radius:50%;background:var(--border2);flex:0 0 9px;}
  .acc-head .status-dot.done{background:var(--green);}
  .acc-body{padding:6px 4px 18px;}

  /* podyum */
  .podium{display:flex;align-items:flex-end;gap:10px;justify-content:center;margin:22px 0 8px;}
  .p-col{flex:1;text-align:center;}
  .p-bib{width:52px;height:52px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:18px;border:2px solid var(--accent);background:var(--accentbg);color:var(--accent);}
  .p-name{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:2px;}
  .p-score{font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:600;}
  .p-bar{border-radius:14px 14px 0 0;background:linear-gradient(180deg,var(--accent),var(--purple));position:relative;overflow:hidden;opacity:.92;}
  .p-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.4) 48%,transparent 66%);background-size:250% 100%;animation:shine 2.6s ease-in-out infinite;}
  @keyframes shine{0%{background-position:160% 0;}100%{background-position:-60% 0;}}
  .p-rank{font-family:'Fraunces',serif;font-weight:700;color:var(--on-accent);padding-top:8px;font-size:20px;position:relative;z-index:1;}
  .p-col.first .p-bar{height:96px;}
  .p-col.second .p-bar{height:72px;}
  .p-col.third .p-bar{height:54px;}
  .p-col.first .p-bib{width:66px;height:66px;font-size:23px;box-shadow:0 0 0 5px var(--accentbg);}

  .results-table{width:100%;border-collapse:collapse;margin-top:6px;}
  .results-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);text-align:left;padding:8px 6px;border-bottom:1px solid var(--border2);}
  .results-table td{padding:9px 6px;font-size:13.5px;border-bottom:1px solid var(--border);}
  .results-table tr:last-child td{border-bottom:none;}
  .results-table input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);}

  .hist-item{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .16s ease;border-radius:10px;}
  .hist-item:hover{background:var(--surface2);}
  .card.dark .hist-item:hover{background:var(--surface);}
  .hist-item:last-child{border-bottom:none;}
  .hist-item .h-name{font-weight:600;font-size:14px;}
  .hist-item .h-date{font-size:11.5px;color:var(--text3);margin-top:2px;}

  .empty{text-align:center;padding:26px 10px;color:var(--text3);font-size:13px;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--surface2);color:var(--green);padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 4px 20px #00000060;z-index:500;border:1px solid var(--green);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s var(--ease);white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .link-box{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;word-break:break-all;color:var(--text);border:1px solid var(--border2);}
  .card.dark .link-box{background:var(--surface);}
  .qr-box{background:#fff;border-radius:var(--radius);padding:16px;display:flex;align-items:center;justify-content:center;margin-top:12px;border:1px solid var(--border2);}
  .stu-num{max-width:70px;flex:0 0 70px;text-align:center;}
  .student-row-wrap{border:1px solid var(--border2);background:var(--surface2);border-radius:var(--radius-sm);padding:10px;transition:border-color .16s ease;}
  .student-row-wrap:hover{border-color:#ff6b6b50;}
  .student-row-wrap input[type=text]{background:var(--surface);}

const KEY = () => `?key=${CONFIG.apiKey}`;

async function translateToEnglish(text){
  const t = (text||"").trim();
  if(!t) return "";
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=tr|en`);
    const data = await res.json();
    return (data?.responseData?.translatedText || "").trim();
  }catch(e){
    return "";
  }
}

/* ---------- Firestore value <-> JS conversion ---------- */
function toVal(v){
  if(v===null||v===undefined) return {nullValue:null};
  if(typeof v==="string") return {stringValue:v};
  if(typeof v==="boolean") return {booleanValue:v};
  if(typeof v==="number") return Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v};
  if(Array.isArray(v)) return {arrayValue:{values:v.map(toVal)}};
  if(typeof v==="object") return {mapValue:{fields:toFields(v)}};
  return {nullValue:null};
}
function toFields(obj){ const f={}; for(const k in obj) f[k]=toVal(obj[k]); return f; }
function fromVal(v){
  if(!v) return null;
  if("stringValue" in v) return v.stringValue;
  if("booleanValue" in v) return v.booleanValue;
  if("integerValue" in v) return parseInt(v.integerValue,10);
  if("doubleValue" in v) return v.doubleValue;
  if("nullValue" in v) return null;
  if("arrayValue" in v) return (v.arrayValue.values||[]).map(fromVal);
  if("mapValue" in v) return fromFields(v.mapValue.fields||{});
  return null;
}
function fromFields(fields){ const o={}; for(const k in (fields||{})) o[k]=fromVal(fields[k]); return o; }
function docFrom(doc){ const id=doc.name.split("/").pop(); return {id, ...fromFields(doc.fields)}; }

/* ---------- Firestore REST helpers ---------- */
async function fsCreate(path, data, id){
  const url = id ? `${BASE}/${path}${KEY()}&documentId=${encodeURIComponent(id)}` : `${BASE}/${path}${KEY()}`;
  const res = await fetch(url,{method:"POST",body:JSON.stringify({fields:toFields(data)})});
  const json = await res.json();
  if(!res.ok){ throw new Error(json?.error?.message || `Kayıt hatası (HTTP ${res.status})`); }
  return json;
}
async function fsGet(path){
  const res = await fetch(`${BASE}/${path}${KEY()}`);
  if(res.status===404) return null;
  const json = await res.json();
  if(!res.ok){ throw new Error(json?.error?.message || `Okuma hatası (HTTP ${res.status})`); }
  return docFrom(json);
}
async function fsList(path){
  const res = await fetch(`${BASE}/${path}${KEY()}&pageSize=300`);
  const data = await res.json();
  if(!res.ok){ throw new Error(data?.error?.message || `Liste alınamadı (HTTP ${res.status})`); }
  return (data.documents||[]).map(docFrom);
}
async function fsPatch(path, data){
  const masks = Object.keys(data).map(k=>`updateMask.fieldPaths=${encodeURIComponent(k)}`).join("&");
  const res = await fetch(`${BASE}/${path}${KEY()}&${masks}`,{method:"PATCH",body:JSON.stringify({fields:toFields(data)})});
  const json = await res.json();
  if(!res.ok){ throw new Error(json?.error?.message || `Güncelleme hatası (HTTP ${res.status})`); }
  return json;
}
async function fsDelete(path){
  await fetch(`${BASE}/${path}${KEY()}`,{method:"DELETE"});
}

  [/^· (\d+) öğrenci · (\d+) jüri · Sıralama oylaması · Kız\/Erkek ayrı$/, "· $1 students · $2 jurors · Ranking vote · Girls/boys separate", "· учеников: $1 · жюри: $2 · Рейтинговое голосование · Девушки/юноши отдельно"],
  [/^· (\d+) öğrenci · (\d+) jüri · Sıralama oylaması · Karışık$/, "· $1 students · $2 jurors · Ranking vote · Mixed", "· учеников: $1 · жюри: $2 · Рейтинговое голосование · Смешанный"],
  [/^Ortalama sıra: (.*)$/, "Average rank: $1", "Среднее место: $1"],
  [/^· (\d+) öğrenci · (\d+) jüri$/, "· $1 students · $2 jurors", "· учеников: $1 · жюри: $2"],
  [/^· (\d+) öğrenci · (\d+) jüri · (\d+) üzerinden · Kız\/Erkek ayrı$/, "· $1 students · $2 jurors · out of $3 · Girls/boys separate", "· учеников: $1 · жюри: $2 · из $3 · Девушки/юноши отдельно"],
  [/^· (\d+) öğrenci · (\d+) jüri · (\d+) üzerinden · Karışık$/, "· $1 students · $2 jurors · out of $3 · Mixed", "· учеников: $1 · жюри: $2 · из $3 · Смешанный"],
  [/^"(.*)" yarışmasını kalıcı olarak silmek istediğine emin misin\? Bu işlem geri alınamaz\.$/, "Are you sure you want to permanently delete \"$1\"? This cannot be undone.", "Вы уверены, что хотите навсегда удалить «$1»? Это действие нельзя отменить."],
  [/^(\d+) üzerinden$/, "out of $1", "из $1"],
  [/^(\d+) öğrenci eklendi$/, "$1 students added", "Добавлено учеников: $1"],
  [/^Kaydedilemedi: (.*)$/, "Could not save: $1", "Не удалось сохранить: $1"],
  [/^Hata: (.*)$/, "Error: $1", "Ошибка: $1"],
  [/^Kayıt hatası \(HTTP (\d+)\)$/, "Save error (HTTP $1)", "Ошибка сохранения (HTTP $1)"],
  [/^Okuma hatası \(HTTP (\d+)\)$/, "Read error (HTTP $1)", "Ошибка чтения (HTTP $1)"],
  [/^Liste alınamadı \(HTTP (\d+)\)$/, "Could not load list (HTTP $1)", "Не удалось загрузить список (HTTP $1)"],
  [/^Güncelleme hatası \(HTTP (\d+)\)$/, "Update error (HTTP $1)", "Ошибка обновления (HTTP $1)"],
  [/^Jüri Durumu · (\d+)\/(\d+) tamamladı$/, "Jury Status · $1/$2 done", "Статус жюри · завершили $1/$2"],
  [/^(\d+)\/(\d+) öğrenci atanmış$/, "$1/$2 students assigned", "Назначено учеников: $1/$2"],
  [/^Kız · Tüm Sıralama · (\d+) yarışmacı$/, "Girls · Full Ranking · $1 contestants", "Девушки · Полный рейтинг · участников: $1"],
  [/^Erkek · Tüm Sıralama · (\d+) yarışmacı$/, "Boys · Full Ranking · $1 contestants", "Юноши · Полный рейтинг · участников: $1"],
  [/^Tüm Sıralama · (\d+) yarışmacı$/, "Full Ranking · $1 contestants", "Полный рейтинг · участников: $1"],
  [/^Seçilenlerle Yeni Yarışma Oluştur \((\d+)\)$/, "Create New Competition with Selected ($1)", "Создать новый конкурс из выбранных ($1)"],
  [/^Genel ortalama: (.*)$/, "Overall average: $1", "Общий средний балл: $1"],
  [/^Jüri: (.*)$/, "Jury: $1", "Жюри: $1"],
  [/^Devam Et \((\d+)\/(\d+)\)$/, "Continue ($1/$2)", "Продолжить ($1/$2)"]
];
function jjCevir(s, L){
  L = L || LANG;
  if(L==="tr" || typeof s!=="string") return s;
  const lead = s.match(/^\s*/)[0], trail = s.match(/\s*$/)[0];
  const core = s.trim().replace(/\s+/g," ");
  if(!core) return s;
  const i = L==="en" ? 0 : 1;
  const d = JJ_SOZLUK[core];
  if(d) return lead + d[i] + trail;
  for(const k of JJ_KALIPLAR){
    if(k[0].test(core)) return lead + core.replace(k[0], k[i+1]) + trail;
  }
  return s;
}
function T(s){ return jjCevir(s); }

const JJ_ATTR = ["placeholder","title","aria-label"];
const jjOrj = new WeakMap(), jjGor = new WeakMap(), jjAttrOrj = new WeakMap();
function jjMetin(node){
  const cur = node.data;
  let base = cur;
  if(jjOrj.has(node) && jjGor.get(node)===cur) base = jjOrj.get(node);
  const out = jjCevir(base);
  jjOrj.set(node, base); jjGor.set(node, out);
  if(out!==cur) node.data = out;
}
function jjAttr(el){
  for(const a of JJ_ATTR){
    if(!el.hasAttribute || !el.hasAttribute(a)) continue;
    const cur = el.getAttribute(a);
    let rec = jjAttrOrj.get(el); if(!rec){ rec = {}; jjAttrOrj.set(el, rec); }
    let base = cur;
    if(rec[a] && rec[a].shown===cur) base = rec[a].orig;
    const out = jjCevir(base);
    rec[a] = {orig:base, shown:out};
    if(out!==cur) el.setAttribute(a, out);
  }
}
function jjDugumCevir(root){
  if(!root) return;
  if(root.nodeType===3){ if(root.parentNode && !/^(SCRIPT|STYLE|TEXTAREA)$/.test(root.parentNode.nodeName)) jjMetin(root); return; }
  if(root.nodeType!==1) return;
  if(/^(SCRIPT|STYLE)$/.test(root.nodeName)) return;
  jjAttr(root);
  root.querySelectorAll && root.querySelectorAll("["+JJ_ATTR.join("],[")+"]").forEach(jjAttr);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const list=[]; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(jjMetin);
}
function jjTarihleriYenile(){
  document.querySelectorAll(".jj-d").forEach(el=>{
    try{ el.textContent = new Date(el.dataset.d).toLocaleDateString(LC(),{day:"numeric",month:"long",year:"numeric"}); }catch(e){}
  });
}
const jjGozlemci = new MutationObserver(list=>{
  jjGozlemci.disconnect();
  try{
    for(const m of list){
      if(m.type==="characterData") jjDugumCevir(m.target);
      else if(m.type==="attributes") jjAttr(m.target);
      else m.addedNodes.forEach(jjDugumCevir);
    }
  } finally { jjGozlemciBaslat(); }
});
function jjGozlemciBaslat(){
  jjGozlemci.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:JJ_ATTR});
}
function jjDilUygula(){
  document.documentElement.lang = LANG;
  const b = document.getElementById("langBtn"); if(b) b.textContent = LANG.toUpperCase();
  jjGozlemci.disconnect();
  jjDugumCevir(document.body);
  jjTarihleriYenile();
  jjGozlemciBaslat();
}
function cycleLang(){
  LANG = LANG==="tr" ? "en" : LANG==="en" ? "ru" : "tr";
  try{ localStorage.setItem("appLang", LANG); }catch(e){}
  jjDilUygula();
}
window.addEventListener("storage", e=>{
  if(e.key==="appLang"){ const l=e.newValue; LANG=(l==="en"||l==="ru")?l:"tr"; jjDilUygula(); }
});
jjGozlemciBaslat();

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function toast(msg, duration){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"), duration || 2200);
}
function esc(s){ return (s||"").toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){
  let txt = d;
  try{ txt = new Date(d).toLocaleDateString(LC(),{day:"numeric",month:"long",year:"numeric"}); }catch(e){}
  return `<span class="jj-d" data-d="${esc(d)}">${esc(txt)}</span>`;
}

function showConfirm(title, message, confirmLabel){
  return new Promise(resolve=>{
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-card">
        <div class="modal-title">${esc(title)}</div>
        <div class="modal-msg">${esc(message)}</div>
        <div class="btn-row" style="margin-top:20px;">
          <button class="btn btn-ghost" id="modal-cancel">Vazgeç</button>
          <button class="btn btn-danger-solid" id="modal-confirm">${esc(confirmLabel || "Evet")}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const close = (result)=>{ overlay.remove(); resolve(result); };
    overlay.querySelector("#modal-cancel").onclick = ()=>close(false);
    overlay.querySelector("#modal-confirm").onclick = ()=>close(true);
    overlay.addEventListener("click", e=>{ if(e.target===overlay) close(false); });
  });
}

let formSubeSecili = new Set();
function subeBilgisi(){
  let liste=[], aktif="";
  try{ liste = JSON.parse(localStorage.getItem("canira_subeler")||"[]"); }catch(e){}
  try{ aktif = localStorage.getItem("canira_sube_aktif")||""; }catch(e){}
  return { liste: Array.isArray(liste)?liste:[], aktif };
}
function subeAdlari(c){
  const { liste }=subeBilgisi();
  if(liste.length<2||!Array.isArray(c.subeIds)||!c.subeIds.length) return "";
  const ad=c.subeIds.map(id=>(liste.find(b=>b.id===id)||{}).ad).filter(Boolean);
  return ad.length?" · "+esc(ad.join(" + ")):"";
}
function subeChipCiz(){
  const el=document.getElementById("f-subeler"); if(!el) return;
  const { liste } = subeBilgisi();
  el.innerHTML = liste.map(b=>`<button type="button" class="btn ${formSubeSecili.has(b.id)?"btn-gold":"btn-ghost"}" style="flex:0 0 auto;width:auto;padding:9px 16px;" onclick="toggleFormSube('${esc(b.id)}')">${esc(b.ad)}</button>`).join("");
}
function toggleFormSube(id){
  if(formSubeSecili.has(id)){ if(formSubeSecili.size<=1){ toast("En az bir şube seçili olmalı"); return; } formSubeSecili.delete(id); }
  else formSubeSecili.add(id);
  subeChipCiz();
  const panel=document.getElementById("stu-pick-panel");
  if(panel && panel.classList.contains("open")) stuPickRender();
}

  const acik = force !== undefined ? force : !panel.classList.contains("open");
  panel.classList.toggle("open", acik);
  if(arrow) arrow.textContent = acik ? "▴" : "▾";
  if(acik){
    try{ stuPickListesi = JSON.parse(localStorage.getItem("canira_ogrenci_listesi") || "[]"); }catch(e){ stuPickListesi = []; }
    document.getElementById("stu-pick-search").value = "";
    stuPickRender();
  }
}
function stuPickMevcutIsimler(){
  return Array.from(document.querySelectorAll("#f-ogrenciler-list .stu-name")).map(i=>i.value.trim().toLocaleLowerCase("tr-TR")).filter(Boolean);
}
function stuPickRender(){
  const list = document.getElementById("stu-pick-list");
  const q = (document.getElementById("stu-pick-search").value || "").trim().toLocaleLowerCase("tr-TR");
  const mevcut = stuPickMevcutIsimler();
  const subeFiltreli = formSubeSecili.size ? stuPickListesi.filter(o=>!Array.isArray(o.subeler) || o.subeler.some(x=>formSubeSecili.has(x))) : stuPickListesi;
  const gorulen = new Set();
  const uygun = subeFiltreli.filter(o=>{
    const k=o.isim.trim().toLocaleLowerCase("tr-TR");
    if(mevcut.includes(k)||gorulen.has(k)) return false; // zaten eklenmiş ya da birden çok şubede kayıtlı: bir kez göster
    gorulen.add(k); return true;
  });
  const filtreli = q ? uygun.filter(o=>o.isim.toLocaleLowerCase("tr-TR").includes(q)) : uygun;
  if(!stuPickListesi.length){
    list.innerHTML = `<div class="stu-pick-empty">Ana uygulamadan öğrenci listesi bulunamadı. Ana uygulamada "Yarışma" butonuna tekrar basıp buraya geri dön.</div>`;
    return;
  }
  if(!filtreli.length){
    list.innerHTML = `<div class="stu-pick-empty">${uygun.length ? "Eşleşen öğrenci yok" : "Tüm öğrenciler zaten eklendi"}</div>`;
    return;
  }
  list.innerHTML = filtreli.map(o=>`
    <label class="stu-pick-row">
      <input type="checkbox" value="${esc(o.isim)}" data-cinsiyet="${o.cinsiyet}">
      <span>${esc(o.isim)}</span>
    </label>`).join("");
}
function stuPickEkle(){
  const secili = Array.from(document.querySelectorAll("#stu-pick-list input:checked"));
  if(!secili.length){ toast("Önce en az bir öğrenci seç"); return; }
  secili.forEach(cb=>addStudentField(undefined, cb.value, cb.dataset.cinsiyet, undefined));
  reorderStudentRows();
  toggleStuPickPanel(false);
  toast(`${secili.length} öğrenci eklendi`);
}
// Ad/soyad girilmiş satırları üstte, boş olanları altta toplar
function reorderStudentRows(){
  const wrap = document.getElementById("f-ogrenciler-list");
  const rows = Array.from(wrap.children);
  const dolu = rows.filter(r=>r.querySelector(".stu-name")?.value.trim());
  const bos = rows.filter(r=>!r.querySelector(".stu-name")?.value.trim());
  [...dolu, ...bos].forEach(r=>wrap.appendChild(r));
}

function addStudentField(numara, isim, cinsiyet, atananJuriler){
  const wrap = document.getElementById("f-ogrenciler-list");
  const nextNum = numara !== undefined ? numara : String(wrap.children.length + 1);
  const g = cinsiyet === "E" ? "E" : "K";
  const row = document.createElement("div");
  row.className = "student-row-wrap";
  row.dataset.gender = g;
  row.dataset.assigned = (atananJuriler && atananJuriler.length) ? atananJuriler.join(",") : "";
  row.innerHTML = `
    <div class="rowline">
      <input type="text" class="stu-num" value="${esc(nextNum)}" placeholder="No">
      <input type="text" class="stu-name" value="${esc(isim||"")}" placeholder="İsim Soyisim">
      <button class="iconbtn" onclick="this.closest('.student-row-wrap').remove()">✕</button>
    </div>
    <div class="gender-toggle">
      <button type="button" class="gender-btn ${g==="K"?"sel":""}" onclick="setStudentGender(this,'K')">Kız</button>
      <button type="button" class="gender-btn ${g==="E"?"sel":""}" onclick="setStudentGender(this,'E')">Erkek</button>
    </div>
    <div class="jury-assign">
      <div class="jury-assign-label">Değerlendirecek jüriler</div>
      <div class="jury-assign-chips"></div>
    </div>`;
  wrap.appendChild(row);
  renderStudentJuryChips(row);
}

function setStudentGender(btn, g){
  const rowWrap = btn.closest(".student-row-wrap");
  rowWrap.dataset.gender = g;
  rowWrap.querySelectorAll(".gender-btn").forEach(b=>b.classList.remove("sel"));
  btn.classList.add("sel");
}

function renderStudentJuryChips(rowWrap){
  const container = rowWrap.querySelector(".jury-assign-chips");
  if(!container) return;
  const juryRows = Array.from(document.querySelectorAll("#f-juriler-list .jury-row"));
  const assignedRaw = rowWrap.dataset.assigned || "";
  const assignedIds = assignedRaw ? assignedRaw.split(",") : [];
  const allActive = assignedRaw === "";
  if(!juryRows.length){ container.innerHTML = `<span style="font-size:11.5px;color:var(--text2);">Önce jüri ekle</span>`; return; }
  container.innerHTML = `
    <button type="button" class="assign-chip ${allActive?"sel":""}" onclick="setStudentJuryAll(this)">Tümü</button>
    ${juryRows.map(jr=>{
      const jid = jr.dataset.id;
      const jname = jr.querySelector(".jury-name").value.trim() || "İsimsiz";
      const active = !allActive && assignedIds.includes(jid);
      return `<button type="button" class="assign-chip ${active?"sel":""}" onclick="toggleStudentJury(this,'${jid}')">${esc(jname)}</button>`;
    }).join("")}
  `;
}

function refreshAllStudentJuryChips(){
  document.querySelectorAll("#f-ogrenciler-list .student-row-wrap").forEach(renderStudentJuryChips);
}

function setStudentJuryAll(btn){
  const rowWrap = btn.closest(".student-row-wrap");
  rowWrap.dataset.assigned = "";
  renderStudentJuryChips(rowWrap);
}

function toggleStudentJury(btn, jid){
  const rowWrap = btn.closest(".student-row-wrap");
  const assignedRaw = rowWrap.dataset.assigned || "";
  let ids = assignedRaw ? assignedRaw.split(",") : [];
  if(assignedRaw === ""){
    ids = [jid];
  } else if(ids.includes(jid)){
    ids = ids.filter(x=>x!==jid);
  } else {
    ids.push(jid);
  }
  rowWrap.dataset.assigned = ids.length ? ids.join(",") : "";
  renderStudentJuryChips(rowWrap);
}

function addJuryField(isim, id, bitirdi){
  const wrap = document.getElementById("f-juriler-list");
  const row = document.createElement("div");
  row.className = "rowline jury-row";
  row.dataset.id = id || uid();
  row.dataset.bitirdi = bitirdi ? "true" : "false";
  row.innerHTML = `<input type="text" class="jury-name" value="${esc(isim||"")}" placeholder="Jüri adı" oninput="refreshAllStudentJuryChips()">
    <button class="iconbtn" onclick="this.parentElement.remove(); refreshAllStudentJuryChips();">✕</button>`;

function addCriterionField(val, enVal){
  const wrap = document.getElementById("f-kriterler");
  const row = document.createElement("div");
  row.className = "crit-field-wrap";
  row.dataset.en = enVal || "";
  row.innerHTML = `
    <div class="rowline">
      <input type="text" class="krit-input" value="${esc(val||"")}" placeholder="Kriter adı" oninput="onCriterionInput(this)">
      <button class="iconbtn" onclick="this.closest('.crit-field-wrap').remove()">✕</button>
    </div>
    <div class="krit-en-preview">${esc(enVal||"")}</div>`;
  wrap.appendChild(row);
  if(val && !enVal){
    translateToEnglish(val).then(en=>{
      row.dataset.en = en;
      row.querySelector(".krit-en-preview").textContent = en;
    });
  }
}

let critTranslateTimer = null;
function onCriterionInput(inputEl){
  const wrap = inputEl.closest(".crit-field-wrap");
  const preview = wrap.querySelector(".krit-en-preview");
  const text = inputEl.value.trim();
  clearTimeout(critTranslateTimer);
  if(!text){ preview.textContent = ""; wrap.dataset.en = ""; return; }
  if(DEFAULT_CRITERIA_EN[text]){
    wrap.dataset.en = DEFAULT_CRITERIA_EN[text];
    preview.textContent = DEFAULT_CRITERIA_EN[text];
    return;
  }
  preview.textContent = "çevriliyor…";
  critTranslateTimer = setTimeout(async ()=>{
    const en = await translateToEnglish(text);
    wrap.dataset.en = en;
    preview.textContent = en;
  }, 500);
}

async function saveCompetitionForm(){
  const isim = document.getElementById("f-isim").value.trim();
  const tarih = document.getElementById("f-tarih").value;
  const kriterler = [];
  const kriterlerEN = [];
  Array.from(document.querySelectorAll("#f-kriterler .crit-field-wrap")).forEach(row=>{
    const v = row.querySelector(".krit-input").value.trim();
    if(v){ kriterler.push(v); kriterlerEN.push(row.dataset.en || ""); }
  });
  const maxPuan = parseInt(document.getElementById("f-skala").value, 10) || 10;
  const yarismaTuru = document.getElementById("f-tur").value;
  const oylamaTuru = document.getElementById("f-oylama").value === "siralama" ? "siralama" : "puan";

  const ogrenciler = Array.from(document.querySelectorAll("#f-ogrenciler-list .student-row-wrap")).map((row,idx)=>{
    const numara = row.querySelector(".stu-num").value.trim();
    const isimVal = row.querySelector(".stu-name").value.trim();
    const cinsiyet = row.dataset.gender === "E" ? "E" : "K";
    const assignedRaw = row.dataset.assigned || "";
    const atananJuriler = assignedRaw ? assignedRaw.split(",") : [];
    return { numara: numara || String(idx+1), isim: isimVal, cinsiyet, atananJuriler };
  }).filter(o=>o.isim);

  const juriler = Array.from(document.querySelectorAll("#f-juriler-list .jury-row")).map(row=>{
    const isimVal = row.querySelector(".jury-name").value.trim();
    if(!isimVal) return null;
    return { id: row.dataset.id || uid(), isim: isimVal, bitirdi: row.dataset.bitirdi === "true" };
  }).filter(Boolean);

  if(!isim){ toast("Yarışma adı gerekli"); return; }
  if(!ogrenciler.length){ toast("En az bir öğrenci ekle (isim gerekli)"); return; }
  if(oylamaTuru==="puan" && !kriterler.length){ toast("En az bir kriter gerekli"); return; }

  try{
    if(formEditId){
      await fsPatch(`yarismalar/${formEditId}`, { isim, tarih, kriterler, kriterlerEN, ogrenciler, juriler, maxPuan, yarismaTuru, oylamaTuru, ...(formSubeSecili.size?{subeIds:[...formSubeSecili]}:{}) });
      toast("Değişiklikler kaydedildi");
      screenAdminCompetition(formEditId);
    } else {
      const compId = uid();
      await fsCreate("yarismalar", {
        isim, tarih, durum:"aktif", olusturma: new Date().toISOString(),
        kriterler, kriterlerEN, ogrenciler, juriler, maxPuan, yarismaTuru, oylamaTuru,
        ...(formSubeSecili.size?{subeIds:[...formSubeSecili]}:{})
      }, compId);
      toast("Yarışma oluşturuldu");
      screenAdminCompetition(compId);
    }
  } catch(err){
    console.error(err);
    toast("Kaydedilemedi: " + err.message, 6000);
  }
}

function copyLink(link){

async function finalizeCompetition(compId){
  const comp = await fsGet(`yarismalar/${compId}`);
  const puanlar = (await fsList(`yarismalar/${compId}/puanlar`)).filter(p=>p.bitirdi);
  if(!puanlar.length){ toast("Henüz tamamlanmış oy yok"); return; }

  const kriterler = comp.kriterler||[];
  const yarismaTuru = comp.yarismaTuru || "karisik";
  const oylamaTuru = comp.oylamaTuru === "siralama" ? "siralama" : "puan";
  let sonuclar;

  if(oylamaTuru === "siralama"){
    // her jürinin verdiği sıra → öğrenci başına sıra ortalaması (düşük = daha iyi)
    const grupDe = og => yarismaTuru==="ayri" ? (og.cinsiyet==="E" ? "E" : "K") : "T";
    sonuclar = (comp.ogrenciler||[]).map(og=>{
      const g = grupDe(og);
      const siralar = [];
      puanlar.forEach(p=>{
        const liste = (p.siralama||{})[g] || [];
        const idx = liste.indexOf(og.numara);
        if(idx >= 0){
          const j = (comp.juriler||[]).find(x=>x.id===p.id);
          siralar.push({ juri: (j&&j.isim) || p.juriIsim || "?", sira: idx+1 });
        }
      });
      const ort = siralar.length ? Math.round(siralar.reduce((a,b)=>a+b.sira,0)/siralar.length*100)/100 : null;
      return { numara: og.numara, isim: og.isim, cinsiyet: og.cinsiyet === "E" ? "E" : "K", ortalama: ort, siralar, oyVerenJuriSayisi: siralar.length };
    });
    // beraberlikte: daha çok 1. sıra alan, sonra daha çok 2. sıra alan öne geçer
    const sayi = (s,n)=>s.siralar.filter(x=>x.sira===n).length;
    const kars = (a,b)=>{
      const ax = a.ortalama==null ? Infinity : a.ortalama, bx = b.ortalama==null ? Infinity : b.ortalama;
      if(ax!==bx) return ax-bx;
      for(let n=1;n<=sonuclar.length;n++){ const d = sayi(b,n)-sayi(a,n); if(d) return d; }
      return 0;
    };
    if(yarismaTuru === "ayri") sonuclar.sort((a,b)=> a.cinsiyet===b.cinsiyet ? kars(a,b) : (a.cinsiyet==="K" ? -1 : 1));
    else sonuclar.sort(kars);
  } else {
    sonuclar = (comp.ogrenciler||[]).map(og=>{
      const kriterOrtalamalari = {};
      let oyVerenSayisi = 0;
      kriterler.forEach(k=>{
        const vals = puanlar.map(p=>(p.puanlar||{})[og.numara]?.[k]).filter(v=>typeof v==="number");
        kriterOrtalamalari[k] = vals.length ? round1(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
        oyVerenSayisi = Math.max(oyVerenSayisi, vals.length);
      });
      const kVals = Object.values(kriterOrtalamalari);
      const ortalama = kVals.length ? kVals.reduce((a,b)=>a+b,0)/kVals.length : 0;
      return { numara: og.numara, isim: og.isim, cinsiyet: og.cinsiyet === "E" ? "E" : "K", ortalama: round1(ortalama), kriterOrtalamalari, oyVerenJuriSayisi: oyVerenSayisi };
    });
    if(yarismaTuru === "ayri"){
      sonuclar.sort((a,b)=> a.cinsiyet===b.cinsiyet ? b.ortalama-a.ortalama : (a.cinsiyet==="K" ? -1 : 1));
    } else {
      sonuclar.sort((a,b)=> b.ortalama - a.ortalama);
    }
  }

  await fsPatch(`yarismalar/${compId}`, { durum:"tamamlandi", kriterler, kriterlerEN: comp.kriterlerEN||[], yarismaTuru, oylamaTuru, sonuclar, sonuclandirmaTarihi: new Date().toISOString() });
  toast("Sonuçlar açıklandı 🏆");
  screenResults(compId);
}

function renderResultsScreen(){
  const rs = resultsState;
  const isAdmin = state.role === "admin";
  const ayri = rs.yarismaTuru === "ayri";
  const kizlar = rs.sonuclar.filter(s=>s.cinsiyet!=="E");
  const erkekler = rs.sonuclar.filter(s=>s.cinsiyet==="E");

  render(`
    <div class="backbar"><button class="back-btn" onclick="goHome()">‹ Ana Ekran</button></div>
    <div class="card dark">
      <div class="eyebrow">Sonuçlar</div>
      <h2 class="title">${esc(rs.isim)}</h2>
      <p class="desc">${fmtDate(rs.tarih)}${ayri ? " · Kız ve Erkek ayrı sıralandı" : ""}</p>
      ${ayri ? `
        <div class="divider"></div>
        <div class="eyebrow">Kız Sıralaması</div>
        ${podiumHtml(kizlar)}
        <div class="divider"></div>
        <div class="eyebrow">Erkek Sıralaması</div>
        ${podiumHtml(erkekler)}
      ` : podiumHtml(rs.sonuclar)}
    </div>

    ${ayri ? `
      ${kizlar.length ? `<div class="card"><div class="eyebrow">Kız · Tüm Sıralama · ${kizlar.length} yarışmacı</div>${rankingTableHtml(kizlar, isAdmin)}</div>` : ""}
      ${erkekler.length ? `<div class="card"><div class="eyebrow">Erkek · Tüm Sıralama · ${erkekler.length} yarışmacı</div>${rankingTableHtml(erkekler, isAdmin)}</div>` : ""}
    ` : (rs.sonuclar.length ? `<div class="card"><div class="eyebrow">Tüm Sıralama · ${rs.sonuclar.length} yarışmacı</div>${rankingTableHtml(rs.sonuclar, isAdmin)}</div>` : "")}

    ${isAdmin && rs.sonuclar.length ? `
    <div class="card dark">
      <div class="eyebrow">Yeni Tur</div>
      <p class="desc">Sıralamadan öğrenci seç, aynı jüri/kriter/skala ile onlar için yeni bir yarışma oluştur (örn. finale kalanlar).</p>
      <div style="margin-top:14px;">
        <button class="btn btn-gold" ${rs.selected.size ? "" : "disabled"} onclick="createFollowupCompetition()">Seçilenlerle Yeni Yarışma Oluştur (${rs.selected.size})</button>
      </div>
    </div>` : ""}

    ${rs.oylamaTuru==="siralama" && rs.sonuclar.length ? `
    <div class="card">
      <div class="eyebrow">Jüri Sıralamaları</div>
      <p class="desc" style="margin-bottom:6px;">Bir öğrenciye dokunarak her jürinin verdiği sırayı gör.</p>
      ${rs.sonuclar.map((s,i)=>`
        <div class="accordion-item">
          <div class="acc-head" onclick="toggleResultRow(${i})">
            <div class="bib" style="width:36px;height:36px;font-size:12.5px;">${esc(s.numara)}</div>
            <div style="flex:1;">
              <div class="stud-name">${esc(s.isim)} <span style="font-weight:400;color:var(--text2);font-size:11.5px;">${s.cinsiyet==="E" ? "(Erkek)" : "(Kız)"}</span></div>
              <div class="stud-meta">Ortalama sıra: ${s.ortalama==null ? "–" : s.ortalama}</div>
            </div>
            <div >${rs.openIndex===i ? "▲" : "▼"}</div>
          </div>
          ${rs.openIndex===i ? `
          <div class="acc-body">
            ${(s.siralar||[]).map(x=>`
              <div class="stud-row" style="padding:8px 0;">
                <div style="flex:1;font-size:13.5px;">${esc(x.juri)}</div>
                <div style="font-weight:700;">${x.sira}.</div>
              </div>
            `).join("")}
          </div>` : ""}
        </div>
      `).join("")}
    </div>` : ""}

    ${rs.oylamaTuru!=="siralama" && rs.sonuclar.length && rs.kriterler.length ? `
    <div class="card">
      <div class="eyebrow">Kritere Göre Ortalamalar</div>
      <p class="desc" style="margin-bottom:6px;">Bir öğrenciye dokunarak kriter bazlı puan dağılımını gör.</p>
      ${rs.sonuclar.map((s,i)=>`
        <div class="accordion-item">
          <div class="acc-head" onclick="toggleResultRow(${i})">
            <div class="bib" style="width:36px;height:36px;flex:0 0 36px;font-size:12.5px;">${esc(s.numara)}</div>
            <div style="flex:1;">
              <div class="stud-name">${esc(s.isim)} <span style="font-weight:400;color:var(--text2);font-size:11.5px;">${s.cinsiyet==="E" ? "(Erkek)" : "(Kız)"}</span></div>
              <div class="stud-meta">Genel ortalama: ${s.ortalama}</div>
            </div>
            <div >${rs.openIndex===i ? "▲" : "▼"}</div>
          </div>
          ${rs.openIndex===i ? `
          <div class="acc-body">
            ${rs.kriterler.map((k,ki)=>`
              <div class="stud-row" style="padding:8px 0;">
                <div style="flex:1;">
                  <div style="font-size:13.5px;">${esc(k)}</div>
                  ${rs.kriterlerEN[ki] ? `<div style="font-size:10.5px;color:var(--text2);font-style:italic;">${esc(rs.kriterlerEN[ki])}</div>` : ""}
                </div>
                <div style="font-weight:700;">${(s.kriterOrtalamalari||{})[k] ?? "–"}</div>
              </div>
            `).join("")}
          </div>` : ""}
        </div>
      `).join("")}
    </div>` : ""}
  `);
}

function toggleResultRow(i){
  resultsState.openIndex = resultsState.openIndex===i ? -1 : i;
  renderResultsScreen();
}

function toggleResultSelect(key){
  if(resultsState.selected.has(key)) resultsState.selected.delete(key);
  else resultsState.selected.add(key);
  renderResultsScreen();
}

function createFollowupCompetition(){
  const rs = resultsState;
  const secilenler = rs.sonuclar.filter(s=>rs.selected.has(keyOf(s))).map(s=>({ numara: s.numara, isim: s.isim, cinsiyet: s.cinsiyet, atananJuriler: [] }));
  if(!secilenler.length) return;
  formEditId = null;
  const draft = {
    isim: `${rs.isim} - Final`,
    tarih: new Date().toISOString().slice(0,10),
    ogrenciler: secilenler,
    juriler: (rs.juriler||[]).map(j=>({ id: uid(), isim: j.isim, bitirdi:false })),
    kriterler: rs.kriterler||[],
    kriterlerEN: rs.kriterlerEN||[],
    maxPuan: rs.maxPuan||10,
    yarismaTuru: rs.yarismaTuru||"karisik",
    oylamaTuru: rs.oylamaTuru||"puan"
  };
  renderCompetitionForm(draft);
}

/* ================= JURY ================= */
async function screenJuryPickCompetition(){
  render(`<div class="backbar"><button class="back-btn" onclick="goHome()">‹ Ana Ekran</button></div><div class="card dark"><div class="center"><div class="spin"></div></div></div>`);
  const comps = (await fsList("yarismalar")).filter(c=>c.durum==="aktif");
  render(`
    <div class="backbar"><button class="back-btn" onclick="goHome()">‹ Ana Ekran</button></div>
    <div class="card dark">
      <div class="eyebrow">Jüri Paneli</div>
      <h2 class="title">Aktif Yarışmayı Seç</h2>
      ${comps.length ? comps.map(c=>`
        <div class="hist-item" onclick="location.search='?j=${c.id}'">
          <div><div class="h-name">${esc(c.isim)}</div><div class="h-date">${fmtDate(c.tarih)}</div></div>
          <span class="chip wait">Aktif</span>
        </div>
      `).join("") : `<div class="empty">Şu an aktif yarışma yok. Yöneticinin sana gönderdiği linki kullan.</div>`}
    </div>
  `);
}

async function screenJuryEnterName(compId){
  render(`<div class="backbar"><button class="back-btn" onclick="goHome()">‹ Ana Ekran</button></div><div class="card dark"><div class="center"><div class="spin"></div></div></div>`);
  const comp = await fsGet(`yarismalar/${compId}`);
  if(!comp){ toast("Yarışma bulunamadı"); return goHome(); }
  if(comp.durum==="tamamlandi"){ return screenResults(compId); }

  const savedJuriId = localStorage.getItem(`jj_juri_${compId}`);
  if(savedJuriId){
    const existing = (comp.juriler||[]).find(j=>j.id===savedJuriId);
    if(existing) return screenJuryScoring(compId, existing.id, existing.isim);
  }

  render(`
    <div class="backbar"><button class="back-btn" onclick="goHome()">‹ Ana Ekran</button></div>
    <div class="card dark">
      <div class="eyebrow">${esc(comp.isim)}</div>
      <h2 class="title">Sen kimsin?</h2>
      <p class="desc">Eğer isminin listede olduğunu biliyorsan seç. Listede yoksan aşağıya yeni jüri olarak ekleyebilirsin.</p>
      ${(comp.juriler||[]).length ? `
      <div class="divider"></div>
      <div class="stack">
        ${comp.juriler.map(j=>`<button class="btn btn-outline" onclick="pickJury('${compId}','${j.id}','${esc(j.isim).replace(/'/g,"\\'")}')">${esc(j.isim)}</button>`).join("")}
      </div>` : ""}
      <div class="divider"></div>
      <label>Yeni jüri olarak katıl</label>
      <input type="text" id="f-juri-isim" placeholder="Adını yaz">
      <button class="btn btn-gold" style="margin-top:12px;" onclick="addAndPickJury('${compId}')">Devam Et</button>
    </div>
  `);
}

async function pickJury(compId, juriId, isim){
  localStorage.setItem(`jj_juri_${compId}`, juriId);
  screenJuryScoring(compId, juriId, isim);
}

async function addAndPickJury(compId){
  const isim = document.getElementById("f-juri-isim").value.trim();
  if(!isim){ toast("İsim gerekli"); return; }
  const comp = await fsGet(`yarismalar/${compId}`);
  const juriId = uid();
  const juriler = [...(comp.juriler||[]), { id: juriId, isim, bitirdi:false }];
  await fsPatch(`yarismalar/${compId}`, { juriler });
  localStorage.setItem(`jj_juri_${compId}`, juriId);
  screenJuryScoring(compId, juriId, isim);
}

let scoringState = null;

async function screenJuryScoring(compId, juriId, juriIsim){
  render(`<div class="card dark"><div class="center"><div class="spin"></div></div></div>`);
  const comp = await fsGet(`yarismalar/${compId}`);
  if(!comp){ toast("Yarışma bulunamadı"); return goHome(); }
  if(comp.durum==="tamamlandi"){ return screenResults(compId); }

  let puanDoc = await fsGet(`yarismalar/${compId}/puanlar/${juriId}`);
  if(!puanDoc){
    await fsCreate(`yarismalar/${compId}/puanlar`, { juriIsim, bitirdi:false, puanlar:{} }, juriId);
    puanDoc = { id: juriId, juriIsim, bitirdi:false, puanlar:{} };
  }

  const tumOgrenciler = comp.ogrenciler||[];
  const atanmisOgrenciler = tumOgrenciler.filter(o => !o.atananJuriler || !o.atananJuriler.length || o.atananJuriler.includes(juriId));

  scoringState = {
    compId, juriId, juriIsim,
    kriterler: comp.kriterler||[],
    kriterlerEN: comp.kriterlerEN||[],
    ogrenciler: atanmisOgrenciler,
    toplamOgrenciSayisi: tumOgrenciler.length,
    maxPuan: comp.maxPuan || 10,
    puanlar: puanDoc.puanlar || {},
    bitirdi: !!puanDoc.bitirdi,
    current: 0,
    oylamaTuru: comp.oylamaTuru === "siralama" ? "siralama" : "puan",
    yarismaTuru: comp.yarismaTuru || "karisik",
    siralama: {}
  };
  if(scoringState.oylamaTuru === "siralama") siralamaHazirla(puanDoc.siralama || {});

  renderScoringScreen();
}

function studentComplete(s){
  const p = scoringState.puanlar[s.numara];
  if(!p) return false;
  return scoringState.kriterler.every(k=>typeof p[k]==="number");
}

function renderScoringScreen(){
  const st = scoringState;
  const doneCount = st.ogrenciler.filter(studentComplete).length;
  const allDone = doneCount === st.ogrenciler.length && st.ogrenciler.length>0;

  if(st.bitirdi){
    render(`
      <div class="backbar"><button class="back-btn" onclick="goHome()">‹ Ana Ekran</button></div>
      <div class="card dark">
        <div class="eyebrow">${esc(st.juriIsim)}</div>
        <h2 class="title">Oylama Tamamlandı</h2>
      </div>
      <div class="card">
        <div class="locked-note">✓ Oylarını kaydettik. Yöneticinin sonuçları açıklamasını bekleyebilirsin.</div>
      </div>
    `);
    return;
  }

  if(!st.ogrenciler.length){
    render(`
      <div class="backbar"><button class="back-btn" onclick="goHome()">‹ Ana Ekran</button></div>
      <div class="card dark">
        <div class="eyebrow">Jüri: ${esc(st.juriIsim)}</div>
        <h2 class="title">Sana Atanan Öğrenci Yok</h2>
        <p class="desc">Yönetici bu yarışmada sana henüz bir öğrenci atamamış.</p>
      </div>
    `);
    return;
  }

  if(st.oylamaTuru === "siralama"){ renderRankingScreen(); return; }

  const s = st.ogrenciler[st.current];
  const complete = studentComplete(s);
  const pct = Math.round((doneCount/st.ogrenciler.length)*100);

  render(`
    <div class="backbar"><button class="back-btn" onclick="goHome()">‹ Ana Ekran</button></div>
    <div class="card dark tight-header">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="eyebrow" style="margin-bottom:0;">Jüri: ${esc(st.juriIsim)}</div>
        <div style="font-size:11.5px;color:var(--accent);font-weight:700;">${doneCount}/${st.ogrenciler.length}${st.ogrenciler.length < st.toplamOgrenciSayisi ? ` (${st.toplamOgrenciSayisi})` : ""}</div>
      </div>
      <div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:${pct}%;"></div></div>
      <div class="chip-strip tight-chips">
        ${st.ogrenciler.map((o,i)=>`<button class="chip-nav tiny ${i===st.current?"active":""} ${studentComplete(o)?"done":""}" onclick="jumpToStudent(${i})">${esc(o.numara)}</button>`).join("")}
      </div>
    </div>

    <div class="card compact-score" id="score-swipe-area">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <div class="bib" style="width:30px;height:30px;font-size:11px;">${esc(s.numara)}</div>
        <div class="stud-name" style="font-size:13.5px;">${esc(s.isim)}${complete ? " ✓" : ""}</div>
      </div>
      ${st.kriterler.map((k,ki)=>`
        <div class="crit-block">
          <div class="crit-name">${esc(k)}${st.kriterlerEN[ki] ? ` <span class="crit-name-en">${esc(st.kriterlerEN[ki])}</span>` : ""}</div>
          <div class="num-grid" style="grid-template-columns:repeat(${st.maxPuan},1fr);">
            ${Array.from({length:st.maxPuan},(_,idx)=>idx+1).map(n=>`
              <button class="num-btn ${((st.puanlar[s.numara]||{})[k]===n) ? "sel":""}" onclick="setScore('${s.numara}','${k.replace(/'/g,"\\'")}',${n})">${n}</button>
            `).join("")}
          </div>
        </div>
      `).join("")}
    </div>

    <div class="card dark score-footer" style="padding:14px 18px;">
      <div class="btn-row">
        <button class="btn btn-ghost" style="padding:11px 14px;" ${st.current===0 ? "disabled":""} onclick="jumpToStudent(${st.current-1})">‹ Önceki</button>
        <button class="btn btn-outline" style="padding:11px 14px;" ${st.current===st.ogrenciler.length-1 ? "disabled":""} onclick="jumpToStudent(${st.current+1})">Sonraki ›</button>
      </div>
      <button class="btn btn-gold" style="margin-top:8px;padding:11px 14px;" ${allDone ? "" : "disabled"} onclick="finishJuryVoting()">${allDone ? "Oylamayı Bitir" : `Devam Et (${doneCount}/${st.ogrenciler.length})`}</button>
    </div>
  `);
  attachSwipeHandlers();
}

function attachSwipeHandlers(){
  const el = document.getElementById("score-swipe-area");
  if(!el) return;
  let startX = 0, startY = 0, tracking = false;
  el.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; tracking = true;
  }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) jumpToStudent(scoringState.current + 1);
      else jumpToStudent(scoringState.current - 1);
    }
  }, {passive:true});
}

function jumpToStudent(i){
  if(i<0 || i>=scoringState.ogrenciler.length) return;
  scoringState.current = i;
  renderScoringScreen();
}

let saveTimer = null;
function setScore(numara, kriter, val){
  const st = scoringState;
  const student = st.ogrenciler.find(o=>o.numara===numara);
  const wasComplete = studentComplete(student);

  if(!st.puanlar[numara]) st.puanlar[numara] = {};
  st.puanlar[numara][kriter] = val;
  renderScoringScreen();

  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    fsPatch(`yarismalar/${st.compId}/puanlar/${st.juriId}`, { puanlar: st.puanlar });
  }, 500);

  const nowComplete = studentComplete(student);
  if(!wasComplete && nowComplete && st.current < st.ogrenciler.length-1){
    setTimeout(()=>{ jumpToStudent(st.current+1); }, 300);
  }
}

async function finishJuryVoting(){
  const st = scoringState;
  if(!(await showConfirm("Oylamayı Bitir", "Oylamayı bitirmek istediğine emin misin? Bitirdikten sonra puanları değiştiremezsin.", "Evet, Bitir"))) return;
  await fsPatch(`yarismalar/${st.compId}/puanlar/${st.juriId}`, { puanlar: st.puanlar, bitirdi:true });
  st.bitirdi = true;
  toast("Oyların kaydedildi ✓");
  renderScoringScreen();
}


/* ---------- SIRALAMA OYLAMASI (jüri yarışmacıları 1.'den sonuncuya sıralar) ---------- */
function siralamaGruplari(){
  const st = scoringState;
  if(st.yarismaTuru === "ayri"){
    return [
      { id:"K", baslik:"Kız Sıralaması", liste: st.ogrenciler.filter(o=>o.cinsiyet!=="E") },
      { id:"E", baslik:"Erkek Sıralaması", liste: st.ogrenciler.filter(o=>o.cinsiyet==="E") }
    ].filter(g=>g.liste.length);
  }
  return [{ id:"T", baslik:"Tüm Yarışmacılar", liste: st.ogrenciler }];
}
// kayıtlı sırayı yükler; sonradan eklenen/çıkan öğrencilere göre düzeltir
function siralamaHazirla(kayitli){
  const st = scoringState;
  siralamaGruplari().forEach(g=>{
    const var_ = g.liste.map(o=>o.numara);
    const eski = (kayitli[g.id]||[]).filter(n=>var_.includes(n));
    st.siralama[g.id] = [...eski, ...var_.filter(n=>!eski.includes(n))];
  });
}
let siralamaKayitZamani = null;
function rankMove(grup, idx, yon){
  const st = scoringState, l = st.siralama[grup], j = idx + yon;
  if(!l || j<0 || j>=l.length) return;
  [l[idx], l[j]] = [l[j], l[idx]];
  renderRankingScreen();
  clearTimeout(siralamaKayitZamani);
  siralamaKayitZamani = setTimeout(()=>{
    fsPatch(`yarismalar/${st.compId}/puanlar/${st.juriId}`, { siralama: st.siralama });
  }, 500);
}
function renderRankingScreen(){
  const st = scoringState;
  const grupHtml = g => {
    const liste = st.siralama[g.id] || [];
    return `
    <div class="card">
      <div class="eyebrow">${g.baslik}</div>
      ${liste.map((num,i)=>{
        const o = st.ogrenciler.find(x=>x.numara===num);
        if(!o) return "";
        return `<div class="stud-row" style="padding:9px 0;">
          <div class="bib" style="width:36px;height:36px;font-size:14px;">${i+1}</div>
          <div style="flex:1;min-width:0;"><div class="stud-name">${esc(o.isim)}</div><div class="stud-meta">No ${esc(o.numara)}</div></div>
          <button class="iconbtn" ${i===0?"disabled":""} style="${i===0?"opacity:.35;":""}" onclick="rankMove('${g.id}',${i},-1)">▲</button>
          <button class="iconbtn" ${i===liste.length-1?"disabled":""} style="${i===liste.length-1?"opacity:.35;":""}" onclick="rankMove('${g.id}',${i},1)">▼</button>
        </div>`;
      }).join("")}
    </div>`;
  };
  render(`
    <div class="backbar"><button class="back-btn" onclick="goHome()">‹ Ana Ekran</button></div>
    <div class="card dark">
      <div class="eyebrow">Jüri: ${esc(st.juriIsim)}</div>
      <h2 class="title">Sıralama</h2>
      <p class="desc">Yarışmacıları ▲▼ düğmeleriyle sırala: en üstteki 1. sıradır.</p>
    </div>
    ${siralamaGruplari().map(grupHtml).join("")}
    <div class="card dark score-footer" style="padding:14px 18px;">
      <button class="btn btn-gold" onclick="finishJuryRanking()">Sıralamayı Bitir</button>
    </div>
  `);
}
async function finishJuryRanking(){
  const st = scoringState;
  if(!(await showConfirm("Sıralamayı Bitir", "Sıralamayı bitirmek istediğine emin misin? Bitirdikten sonra sıralamayı değiştiremezsin.", "Evet, Bitir"))) return;
  clearTimeout(siralamaKayitZamani);
  await fsPatch(`yarismalar/${st.compId}/puanlar/${st.juriId}`, { siralama: st.siralama, bitirdi:true });
  st.bitirdi = true;
  toast("Sıralaman kaydedildi ✓");
  renderScoringScreen();
}
