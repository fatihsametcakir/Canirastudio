<!DOCTYPE html>
<html lang="tr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Öğrenci Kayıt Formu · Can & Irina Studio</title>
<link rel="icon" href="icon-192-v3.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d14;--surface:#161621;--surface2:#1d1d2b;--border:#3a3326;--text:#f2f0fa;--text2:#c9c6d8;--text3:#8c89a0;--gold:#d9ac52;--gold2:#e8c36a;--red:#e5334d;--ok:#34d399;}
@media(prefers-color-scheme:light){:root{--bg:#f5f4f8;--surface:#fff;--surface2:#f0eef5;--border:#c9ad6f;--text:#1c1a28;--text2:#4b4860;--text3:#7a7690;--gold:#9a6f1c;--gold2:#7a5410;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Fraunces',Georgia,serif;font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.marka{text-align:center;margin:6px 0 20px}
.marka b{display:block;font-family:'Cormorant Garamond','Fraunces',serif;font-size:30px;font-weight:600;color:var(--gold2);letter-spacing:.04em}
.marka span{font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--text3)}
.kart{background:var(--surface);border:1.5px solid var(--border);box-shadow:inset 0 0 0 1px #d9ac5222;border-radius:18px;padding:16px;margin-bottom:14px}
.kb{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:12px}
.f{margin-bottom:13px}
.f label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.f input,.f select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font:inherit;font-size:15px;outline:none}
.f input:focus,.f select:focus{border-color:var(--gold)}
.metin{max-height:200px;overflow-y:auto;font-size:13px;line-height:1.65;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;white-space:pre-line}
.metin.kisa{max-height:none}
.metin b{color:var(--text)}
.onay{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;cursor:pointer;margin-bottom:14px}
.onay input{width:22px;height:22px;flex-shrink:0;margin-top:1px;accent-color:var(--gold)}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font:inherit;font-size:16px;font-weight:600;color:#fff;background:var(--red);cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hata{display:none;color:#ff7a8c;font-size:13px;margin:10px 2px;line-height:1.5}
.not{font-size:12px;color:var(--text3);line-height:1.6;margin:8px 2px}
.durum{text-align:center;padding:40px 10px}
.durum .i{font-size:46px;margin-bottom:10px}
.durum h1{font-size:20px;margin-bottom:8px}
.durum p{color:var(--text2);font-size:14px;line-height:1.6}
.onizleme{background:#fbbf2420;border:1px solid #fbbf2455;color:#fbbf24;border-radius:12px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;text-align:center}
.dilsec{display:flex;justify-content:center;gap:6px;margin:0 0 14px}
.dilsec button{border:1.5px solid var(--border);background:var(--surface);color:var(--text2);border-radius:99px;padding:6px 16px;font:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.dilsec button.on{border-color:var(--gold);color:var(--gold2);box-shadow:inset 0 0 0 1px #d9ac5240}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>

<div class="wrap">
  <div class="marka"><b>Can &amp; Irina</b><span>Dance Studio</span></div>
  <div id="icerik"><div class="durum"><div class="i">⏳</div><p>…</p></div></div>

 aydVar:'Уведомление о персональных данных',aydOnay:'Я <b>прочитал(а) и понял(а)</b> уведомление о персональных данных.',b3:'3 · Заявления о явном согласии',rizaNot:'Эти согласия необязательны: отказ не повлияет на вашу регистрацию. Вы можете отозвать согласие в любое время.',rizaVars:'<b>Даю явное согласие.</b>',

const DILLER=['tr','en','ru'];
let L=(()=>{const a=q.get('lang');if(DILLER.includes(a))return a;try{const k=localStorage.getItem('kf_dil');if(DILLER.includes(k))return k;}catch(e){}const n=(navigator.language||'tr').slice(0,2).toLowerCase();return DILLER.includes(n)?n:'tr';})();
const T=k=>(UI[L]&&UI[L][k])||UI.tr[k]||'';
let MD={};


function durum(ikon,baslik,metin){
  const k=$('icerik');k.textContent='';
  const d=el('div',{class:'durum'});d.append(el('div',{class:'i'},ikon),el('h1',null,baslik),el('p',null,metin));k.append(d);
}
async function api(govde){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({dil:L},govde))});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.hata||T('sorun')),{kod:r.status});
  return j;
}
function metinKutu(m,kisa){const d=el('div',{class:'metin'+(kisa?' kisa':'')});if(m.baslik){d.append(el('b',null,m.baslik));d.append(document.createTextNode('\n\n'));}d.append(document.createTextNode(m.metin||''));return d;}
function onayKutu(id,html){const l=el('label',{class:'onay'});const i=el('input',{type:'checkbox',id});const s=el('span');s.innerHTML=html;l.append(i,s);return l;}
function alan(id,etiket,tip,ph,ek){const f=el('div',{class:'f'});f.append(el('label',{for:id},etiket));const i=el('input',Object.assign({id,type:tip||'text',placeholder:ph||'',autocomplete:'off'},ek||{}));f.append(i);return f;}
function kart(baslik){const k=el('div',{class:'kart'});if(baslik)k.append(el('div',{class:'kb'},baslik));return k;}

function formuCiz(){
  const k=$('icerik');k.textContent='';
  k.append(dilSecici());
  if(L!=='tr'&&T('dilNot'))k.append(el('div',{class:'not',style:'margin:0 2px 12px;text-align:center'},T('dilNot')));
  if(ONIZLEME)k.append(el('div',{class:'onizleme'},T('onizleme')));
  // 1. Bilgiler
  const k1=kart(T('b1'));
  k1.append(alan('ad',T('ad'),'text',T('adPh'),{maxlength:60,autocomplete:'given-name'}),alan('soyad',T('soyad'),'text',T('soyadPh'),{maxlength:60,autocomplete:'family-name'}));
  const cf=el('div',{class:'f'});cf.append(el('label',{for:'cins'},T('cins')));const sel=el('select',{id:'cins'});[['k',T('kadin')],['e',T('erkek')]].forEach(([v,t])=>{const o=el('option',{value:v},t);sel.append(o);});cf.append(sel);k1.append(cf);
  const dg=alan('dogum',T('dogum'),'date');dg.querySelector('input').addEventListener('input',guncelle);k1.append(dg);
  k1.append(alan('tel',T('tel'),'tel','5xx xxx xx xx',{maxlength:25,autocomplete:'tel'}),alan('eposta',T('eposta'),'email','name@mail.com',{maxlength:120,autocomplete:'email'}),alan('acil',T('acil'),'text',T('acilPh'),{maxlength:160}));
  const veli=el('div',{id:'veli',style:'display:none'});
  veli.append(el('div',{class:'not',style:'margin:0 0 10px'},T('veliNot')),alan('veli-ad',T('veliAd'),'text',T('veliAdPh'),{maxlength:60}),alan('veli-yakin',T('veliYakin'),'text',T('veliYakinPh'),{maxlength:80}),alan('veli-tel',T('veliTel'),'tel','5xx xxx xx xx',{maxlength:25}));
  k1.append(veli);k.append(k1);
  // 2. Aydınlatma
  const k2=kart('2 · '+(M.aydinlatma.baslik||T('aydVar')));trNotu(k2,'aydinlatma');
  k2.append(metinKutu({baslik:'',metin:M.aydinlatma.metin}),onayKutu('c-ayd',T('aydOnay')));
  k.append(k2);
  // 3. Açık rızalar
  if(M.rizalar.length){
    const k3=kart(T('b3'));
    k3.append(el('div',{class:'not',style:'margin:0 0 10px'},T('rizaNot')));
    M.rizalar.forEach(r=>{trNotu(k3,'r_'+r.id);k3.append(metinKutu({baslik:r.baslik,metin:r.metin},true));k3.append(onayKutu('r-'+r.id,r.kutu?escape(r.kutu):T('rizaVars')));});
    k.append(k3);
  }
  // 4. Kurallar
  const k4=kart('4 · '+(M.kurallar.baslik||T('kurVar')));trNotu(k4,'kurallar');
  k4.append(metinKutu({baslik:'',metin:M.kurallar.metin}),onayKutu('c-kural',T('kurOnay')));
  k.append(k4);
  // Veli beyanı
  const kv=kart(T('veliB'));kv.id='kv';kv.style.display='none';trNotu(kv,'veli');
  kv.append(metinKutu({baslik:'',metin:M.veli.metin||T('veliVars')},true),onayKutu('c-veli',T('veliOnay')));
  k.insertBefore(kv,k4.nextSibling);
  const hp=el('input',{class:'hp',id:'hp',tabindex:'-1',autocomplete:'off','aria-hidden':'true'});k.append(hp);
  const b=el('button',{class:'btn',id:'gonder',disabled:'disabled'},T('gonder'));b.addEventListener('click',gonder);k.append(b);
  k.append(el('div',{class:'hata',id:'hata'}),el('div',{class:'not'},T('kanit')));
  k.querySelectorAll('input[type=checkbox],input').forEach(i=>i.addEventListener('input',guncelle));
  guncelle();
}
function dilSecici(){
  const d=el('div',{class:'dilsec'});
  DILLER.forEach(l=>{const b=el('button',{type:'button',class:l===L?'on':''},l.toUpperCase());b.addEventListener('click',()=>dilDegistir(l));d.append(b);});
  return d;
}
function trNotu(kart,bolum){if(L!=='tr'&&MD&&MD[bolum]==='tr')kart.append(el('div',{class:'not',style:'margin:-4px 0 10px'},T('sadeceTr')));}
async function yukle(){
  try{const j=await api({islem:'bilgi',k:KOD});M=j.metin;MD=j.diller||{};ONIZLEME=!!j.onizleme;formuCiz();return true;}
  catch(e){durum(e.kod===410?'🔒':'⚠️',e.kod===410?T('yok'):T('acilmadi'),e.message||T('sonraDene'));return false;}
}
async function dilDegistir(l){
  if(l===L)return;
  const alanlar={};['ad','soyad','cins','dogum','tel','eposta','acil','veli-ad','veli-yakin','veli-tel'].forEach(i=>{const e=$(i);if(e)alanlar[i]=e.value;});
  const isaretliydi=[...document.querySelectorAll('input[type=checkbox]')].some(c=>c.checked);
  L=l;try{localStorage.setItem('kf_dil',l);}catch(e){}
  document.documentElement.lang=l;
  if(!(await yukle()))return;
  Object.keys(alanlar).forEach(i=>{const e=$(i);if(e)e.value=alanlar[i];});
  guncelle();
  if(isaretliydi){const h=$('hata');h.textContent=T('dilDegisti');h.style.display='block';}
}
function escape(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function yas(d){if(!d)return null;const b=new Date(d+'T00:00:00'),n=new Date();let y=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))y--;return y;}
function kucukMu(){const y=yas($('dogum').value);return y!==null&&y<18;}
function guncelle(){
  const kc=kucukMu();$('veli').style.display=kc?'block':'none';$('kv').style.display=kc?'block':'none';
  const ok=$('c-ayd').checked&&$('c-kural').checked&&(!kc||$('c-veli').checked);
  $('gonder').disabled=!ok||ONIZLEME;
}

// ── Cihaz ve davranış kanıtı (yalnızca onay ispatı amacıyla) ──
const T0=Date.now(),TIK={};let DOKUNMA=0,TUS=0;
['touchstart','pointerdown','mousedown'].forEach(e=>addEventListener(e,()=>{DOKUNMA++;},{passive:true}));
addEventListener('keydown',()=>{TUS++;},{passive:true});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.type==='checkbox'&&t.id)TIK[t.id]=(TIK[t.id]||[]).concat([[t.checked?1:0,Date.now()-T0]]).slice(-6);});
async function cihazTopla(){
  const n=navigator,c={},sc=screen;
  try{
    c.dil=n.language||'';c.diller=(n.languages||[]).join(',');c.tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';c.tzOfset=new Date().getTimezoneOffset();
    c.ekran=sc.width+'x'+sc.height;c.ekranKullanilabilir=sc.availWidth+'x'+sc.availHeight;c.pencere=innerWidth+'x'+innerHeight;c.dpr=devicePixelRatio;c.renkDerinligi=sc.colorDepth;
    c.yon=(sc.orientation&&sc.orientation.type)||'';c.platform=n.platform||'';c.cekirdek=n.hardwareConcurrency||0;c.bellekGB=n.deviceMemory||0;c.dokunmaNoktasi=n.maxTouchPoints||0;
    c.cerez=!!n.cookieEnabled;c.dnt=n.doNotTrack||'';c.ag=(n.connection&&n.connection.effectiveType)||'';c.saat=new Date().toString().slice(0,60);

    if(n.userAgentData){c.uadMobil=!!n.userAgentData.mobile;c.uadPlatform=n.userAgentData.platform||'';c.uadMarka=(n.userAgentData.brands||[]).map(b=>b.brand+' '+b.version).join(', ');
      try{const h=await n.userAgentData.getHighEntropyValues(['model','platformVersion','architecture','fullVersionList']);c.uadModel=h.model||'';c.uadSurum=h.platformVersion||'';c.uadMimari=h.architecture||'';}catch(e){}}
    try{const g=document.createElement('canvas').getContext('webgl');const x=g&&g.getExtension('WEBGL_debug_renderer_info');if(x)c.gpu=String(g.getParameter(x.UNMASKED_RENDERER_WEBGL)||'').slice(0,100);}catch(e){}
    try{let id=localStorage.getItem('kf_cihaz');if(!id){id=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());localStorage.setItem('kf_cihaz',id);}c.cihazId=id;}catch(e){c.cihazId='';}
    c.formSuresiSn=Math.round((Date.now()-T0)/1000);c.dokunma=DOKUNMA;c.tus=TUS;c.tiklar=JSON.stringify(TIK).slice(0,300);

  }catch(e){}
  return c;
}
function hataGoster(m){const h=$('hata');h.textContent=m;h.style.display='block';h.scrollIntoView({behavior:'smooth',block:'center'});}
async function gonder(){
  const v=id=>($(id).value||'').trim();
  $('hata').style.display='none';
  const kc=kucukMu();
  if(!v('ad')||!v('soyad'))return hataGoster(T('vAd'));
  if(!v('dogum'))return hataGoster(T('vDogum'));
  if(v('tel').replace(/\D/g,'').length<10)return hataGoster(T('vTel'));
  if(kc&&(!v('veli-ad')||!v('veli-yakin')||v('veli-tel').replace(/\D/g,'').length<10))return hataGoster(T('vVeli'));
  const riz={};M.rizalar.forEach(r=>{riz[r.id]=$('r-'+r.id).checked;});
  const b=$('gonder');b.disabled=true;b.textContent=T('gonderiliyor');
  try{
    await api({islem:'gonder',k:KOD,hp:v('hp'),
      ogrenci:{ad:v('ad'),soyad:v('soyad'),cinsiyet:$('cins').value,dogum:v('dogum'),tel:v('tel'),eposta:v('eposta'),acil:v('acil')},
      veli:kc?{ad:v('veli-ad'),yakinlik:v('veli-yakin'),tel:v('veli-tel')}:null,
      onaylar:{aydinlatma:$('c-ayd').checked,kural:$('c-kural').checked,veli:kc?$('c-veli').checked:false,rizalar:riz},
      cihaz:await cihazTopla()});
    durum('✅',T('tamamB'),T('tamamM'));
  }catch(e){
    if(e.kod===410||e.kod===404){durum('🔒',T('yok'),e.message);return;}
    b.textContent=T('gonder');guncelle();hataGoster(e.message||T('gonderilemedi'));
  }
}
