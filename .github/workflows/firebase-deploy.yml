name: Firebase Deploy (functions + kurallar)

# Yalnızca sunucu fonksiyonu veya veritabanı kuralları değiştiğinde çalışır.
# index.html değişiklikleri GitHub Pages ile zaten kendiliğinden yayınlanır.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
  workflow_dispatch: {}   # Actions sekmesinden elle de çalıştırılabilir

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fonksiyon bağımlılıklarını kur
        run: npm install --prefix functions --no-audit --no-fund
      - name: Servis hesabı anahtarını hazırla
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy
        run: npx --yes firebase-tools@latest deploy --only functions,firestore:rules --project canirinastudio --non-interactive --force
      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
